name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      WINDIR: C:\Windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore ZCompare.slnx
      - name: Build
        run: dotnet build ZCompare.slnx -c Release --no-restore --warnaserror
      - name: Test
        run: dotnet test ZCompare.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Scan public content and history
        shell: pwsh
        run: ./tools/Test-PublicRelease.ps1 -IncludeHistory
